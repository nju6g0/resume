    ></script>
    <script>
      (function () {
        var l = window.location;
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            });
          var route = decoded[0].slice(1);
          var query = decoded.slice(1).find(function (s) {
            return s.indexOf("q=") === 0;
          });
          // 使用 History API 替換網址
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) +
              route +
              (query ? "?" + query.slice(2) : "") +
              l.hash,
          );
        }
      })();
    </script>
